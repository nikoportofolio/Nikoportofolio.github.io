<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andri Website</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->

    <header>

        <h1>📦 ANDRI WEBSITE</h1>

        <p>Catatan Barang Event</p>

    </header>


    <!-- Dashboard -->

    <section class="dashboard">

        <div class="cardDashboard">

            <h3>Total Barang</h3>

            <span id="totalBarang">0</span>

        </div>

        <div class="cardDashboard konstruksi">

            <h3>Kontruksi</h3>

            <span id="totalKontruksi">0</span>

        </div>

        <div class="cardDashboard furniture">

            <h3>Furniture</h3>

            <span id="totalFurniture">0</span>

        </div>

        <div class="cardDashboard electric">

            <h3>Electric</h3>

            <span id="totalElectric">0</span>

        </div>

    </section>


    <!-- Search -->

    <section class="searchBox">

        <input
        type="text"
        id="search"
        placeholder="Cari Barang...">

    </section>


    <!-- Form -->

    <section class="formBox">

        <select id="kategori">

            <option value="Kontruksi">Kontruksi</option>

            <option value="Furniture">Furniture</option>

            <option value="Electric">Electric</option>

        </select>


        <input
        type="text"
        id="namaBarang"
        placeholder="Nama Barang">


        <input
        type="number"
        id="jumlahBarang"
        placeholder="Jumlah">


        <button id="btnTambah">

            <i class="fa-solid fa-plus"></i>

            Tambah Barang

        </button>

    </section>


    <!-- Menu -->

    <section class="menuKategori">

        <button onclick="scrollKategori('kontruksiArea')">

            🟦 Kontruksi

        </button>

        <button onclick="scrollKategori('furnitureArea')">

            🟩 Furniture

        </button>

        <button onclick="scrollKategori('electricArea')">

            🟨 Electric

        </button>

    </section>



    <!-- KONTRUKSI -->

    <section
    id="kontruksiArea"
    class="kategori">

        <div class="judulKategori">

            <h2>🟦 KONTRUKSI</h2>

            <span id="jumlahKontruksi">

                0 Barang

            </span>

        </div>

        <div
        id="listKontruksi"
        class="listBarang">

        </div>

    </section>



    <!-- FURNITURE -->

    <section
    id="furnitureArea"
    class="kategori">

        <div class="judulKategori">

            <h2>🟩 FURNITURE</h2>

            <span id="jumlahFurniture">

                0 Barang

            </span>

        </div>

        <div
        id="listFurniture"
        class="listBarang">

        </div>

    </section>



    <!-- ELECTRIC -->

    <section
    id="electricArea"
    class="kategori">

        <div class="judulKategori">

            <h2>🟨 ELECTRIC</h2>

            <span id="jumlahElectric">

                0 Barang

            </span>

        </div>

        <div
        id="listElectric"
        class="listBarang">

        </div>

    </section>



    <!-- Bottom Menu -->

    <div class="bottomMenu">

        <button id="btnBackup">

            <i class="fa-solid fa-download"></i>

        </button>

        <button id="btnRestore">

            <i class="fa-solid fa-upload"></i>

        </button>

        <button id="btnDark">

            <i class="fa-solid fa-moon"></i>

        </button>

        <button id="btnReset">

            <i class="fa-solid fa-trash"></i>

        </button>

    </div>



</div>



<!-- Template Card -->

<template id="barangTemplate">

<div class="barangCard">

    <div class="atas">

        <h3 class="namaBarang"></h3>

        <button class="favorit">

            ⭐

        </button>

    </div>


    <p>

        Jumlah :

        <span class="jumlahBarang">

        </span>

    </p>


    <div class="quickButton">

        <button class="minus5">

            -5

        </button>

        <button class="minus1">

            -1

        </button>

        <button class="plus1">

            +1

        </button>

        <button class="plus5">

            +5

        </button>

    </div>


    <div class="aksi">

        <button class="edit">

            ✏ Edit

        </button>

        <button class="hapus">

            🗑 Hapus

        </button>

    </div>

</div>

</template>



<script src="app.js"></script>

</body>
</html>
