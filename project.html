<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Niko Juliandarus</title>
    <link rel="stylesheet" href="css/project-detail.css">
</head>
<body>

<main class="project-page">

    <a href="index.html#projects" class="back-link">← Back to Projects</a>

    <section class="project-hero">
        <div class="project-cover-wrap">
            <img id="project-cover" class="project-cover" alt="">
        </div>

        <div class="project-heading">
            <p id="project-category" class="project-category"></p>
            <h1 id="project-title"></h1>
        </div>
    </section>

    <section class="process-section">
        <div class="section-heading">
            <p class="eyebrow">PROJECT JOURNEY</p>
            <h2>Process & On-site Work</h2>
            <p class="section-intro">
                Project process photos can be added to each project's folder.
            </p>
        </div>

        <div class="process-carousel">
            <div id="process-gallery" class="process-gallery" aria-label="Project process photos"></div>

            <div id="process-nav" class="process-nav" hidden>
                <button id="process-prev" class="process-arrow" type="button" aria-label="Previous photos">←</button>
                <button id="process-next" class="process-arrow" type="button" aria-label="Next photos">→</button>
            </div>
        </div>

        <p id="empty-process" class="empty-process" hidden>
            No process photos have been added to this project yet.
        </p>
    </section>

</main>

<div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close">×</button>
    <button class="lightbox-prev" type="button" aria-label="Previous photo">←</button>
    <img id="lightbox-image" alt="">
    <button class="lightbox-next" type="button" aria-label="Next photo">→</button>
</div>

<script src="js/project-detail.js"></script>
</body>
</html>
